name: 'Update YAML'
author: Rick Meneely <rick@meneely.com>
branding:
  icon: edit
  color: purple
description: Update YAML file values
inputs:
  infile:
    description: The YAML file to be updated
    default: 'values.yaml'
    required: false
  varlist:
    description: Comma separated list of var=value
    default: ''
    required: false
outputs:
  updated:
    description: 'Set to true or false based on if the infile was modified'
    value: ${{ steps.update-yaml.outputs.updated }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.9'
    - env:
        ACTION_PATH: ${{ github.action_path }}
        INFILE: ${{ inputs.infile }}
        VARLIST: ${{ inputs.varlist }}
      run: |
        python "$ACTION_PATH/update-yaml.py" -i "$INFILE" -V "$VARLIST" > "$ACTION_PATH/.update-yaml.tmp"
      shell: bash
    - env:
        ACTION_PATH: ${{ github.action_path }}
        INFILE: ${{ inputs.infile }}
      run: >
        updated=$((diff "$INFILE" "$ACTION_PATH/.update-yaml.tmp" || true) | wc -l | sed -e 's/ //g') ; if [ $updated = 0 ]; then updated='false' ; else updated='true' ; fi ; echo "updated=${updated}" >> $GITHUB_OUTPUT ; mv "$ACTION_PATH/.update-yaml.tmp" "$INFILE"

      shell: bash
      id: update-yaml
