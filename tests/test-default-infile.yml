name: Test default infile (values.yaml)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create default values.yaml in working directory
        run: |
          mkdir -p /tmp/yaml-test-dir
          printf 'appVersion: 0.1.0\nenvironment: staging\n' > /tmp/yaml-test-dir/values.yaml
          echo "Input file contents:"
          cat /tmp/yaml-test-dir/values.yaml

      - id: action
        uses: .
        with:
          infile: /tmp/yaml-test-dir/values.yaml
          varlist: "appVersion=1.0.0"

      - name: Assert updated output is true
        env:
          ACTUAL: ${{ steps.action.outputs.updated }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert file was updated
        run: |
          echo "Contents of values.yaml:"
          cat /tmp/yaml-test-dir/values.yaml
          if ! grep -q "appVersion: 1.0.0" /tmp/yaml-test-dir/values.yaml; then
            echo "FAIL: appVersion was not updated to 1.0.0"
            exit 1
          fi
          echo "PASS: appVersion updated correctly"
