name: Test default infile (values.yaml)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create default values.yaml in working directory
        run: |
          cat > values.yaml << 'EOF'
          app:
            version: 1.0.0
          environment: staging
          EOF

      - id: action
        uses: .
        with:
          varlist: "app.version=2.0.0"

      - name: Assert updated output is true
        env:
          ACTUAL: ${{ steps.action.outputs.updated }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert default values.yaml was updated
        run: |
          echo "File contents:"
          cat values.yaml
          if ! grep -q "version: 2.0.0" values.yaml; then
            echo "FAIL: expected 'version: 2.0.0' in values.yaml"
            exit 1
          fi
          echo "PASS"
