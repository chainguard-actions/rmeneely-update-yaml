name: Test updating multiple YAML values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test YAML file
        run: |
          cat > /tmp/test-multi.yaml << 'EOF'
          image:
            tag: v1.0.0
            repository: myapp
          replicas: 3
          EOF

      - id: action
        uses: .
        with:
          infile: /tmp/test-multi.yaml
          varlist: "image.tag=v2.5.0,replicas=5"

      - name: Assert updated output is true
        env:
          ACTUAL: ${{ steps.action.outputs.updated }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert all values were updated
        run: |
          echo "File contents:"
          cat /tmp/test-multi.yaml
          if ! grep -q "tag: v2.5.0" /tmp/test-multi.yaml; then
            echo "FAIL: expected 'tag: v2.5.0' in file"
            exit 1
          fi
          if ! grep -q "replicas: 5" /tmp/test-multi.yaml; then
            echo "FAIL: expected 'replicas: 5' in file"
            exit 1
          fi
          echo "PASS: all values updated correctly"
