name: Test multiple variable updates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test YAML file
        run: |
          cat > /tmp/test-multi.yaml << 'EOF'
          image: nginx
          tag: latest
          replicas: 1
          EOF

      - id: action
        uses: .
        with:
          infile: /tmp/test-multi.yaml
          varlist: "tag=v2.0.0,replicas=3"

      - name: Assert updated output is true
        env:
          ACTUAL: ${{ steps.action.outputs.updated }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert tag was updated
        run: |
          echo "File contents:"
          cat /tmp/test-multi.yaml
          if ! grep -q "tag: v2.0.0" /tmp/test-multi.yaml; then
            echo "FAIL: expected 'tag: v2.0.0' in file"
            exit 1
          fi
          echo "PASS: tag updated"

      - name: Assert replicas was updated
        run: |
          if ! grep -q "replicas: 3" /tmp/test-multi.yaml; then
            echo "FAIL: expected 'replicas: 3' in file"
            exit 1
          fi
          echo "PASS: replicas updated"

      - name: Assert image was not changed
        run: |
          if ! grep -q "image: nginx" /tmp/test-multi.yaml; then
            echo "FAIL: expected 'image: nginx' to remain unchanged"
            exit 1
          fi
          echo "PASS: image unchanged"
