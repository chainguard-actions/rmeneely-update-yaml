name: Test no change when values are the same
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test YAML file with existing values
        run: |
          cat > /tmp/test-nochange.yaml << 'EOF'
          image: nginx
          tag: v1.0.0
          replicas: 2
          EOF

      - id: action
        uses: .
        with:
          infile: /tmp/test-nochange.yaml
          varlist: "tag=v1.0.0,replicas=2"

      - name: Assert updated output is false
        env:
          ACTUAL: ${{ steps.action.outputs.updated }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert file content is unchanged
        run: |
          echo "=== File contents ==="
          cat /tmp/test-nochange.yaml
          if ! grep -q "tag: v1.0.0" /tmp/test-nochange.yaml; then
            echo "FAIL: expected 'tag: v1.0.0' to remain in file"
            exit 1
          fi
          if ! grep -q "replicas: 2" /tmp/test-nochange.yaml; then
            echo "FAIL: expected 'replicas: 2' to remain in file"
            exit 1
          fi
          echo "PASS"
